<div class="sidebar" [class.collapsed]="!isSidebarOpen()">
    <div class="sidebar-header">
        <span class="logo-text" *ngIf="isSidebarOpen()">Self Risk</span>
        <button class="toggle-btn" (click)="toggleSidebar()">
            <span class="material-icons">{{ isSidebarOpen() ? 'menu_open' : 'menu' }}</span>
        </button>
    </div>

    <ul class="menu-list">
        <li *ngFor="let item of menuItems()" class="menu-item">
            <!-- Single Item -->
            <a *ngIf="!item.children" [routerLink]="item.route" routerLinkActive="active" class="menu-link"
                [title]="item.label">
                <span class="material-icons icon">{{ item.icon }}</span>
                <span class="label" *ngIf="isSidebarOpen()">{{ item.label }}</span>
            </a>

            <!-- Dropdown Item -->
            <div *ngIf="item.children" class="menu-dropdown">
                <div class="menu-link" (click)="toggleSubmenu(item)" [class.active]="item.isOpen" [title]="item.label">
                    <span class="material-icons icon">{{ item.icon }}</span>
                    <span class="label" *ngIf="isSidebarOpen()">{{ item.label }}</span>
                    <span class="material-icons arrow" *ngIf="isSidebarOpen()">{{ item.isOpen ? 'expand_less' :
                        'expand_more' }}</span>
                </div>

                <ul class="submenu" [@slideInOut]="item.isOpen ? 'true' : 'false'" *ngIf="isSidebarOpen()">
                    <li *ngFor="let subItem of item.children">
                        <a [routerLink]="subItem.route" routerLinkActive="active" class="submenu-link">
                            <span class="material-icons sub-icon">{{ subItem.icon }}</span>
                            <span class="sub-label">{{ subItem.label }}</span>
                        </a>
                    </li>
                </ul>
            </div>
        </li>
    </ul>

    <div class="sidebar-footer">
        <div class="profile-block" *ngIf="isSidebarOpen()">
            <div class="avatar-section">
                <div class="avatar-circle">
                    <span class="initial">{{ userName().charAt(0) }}</span>
                </div>
            </div>

            <div class="info-section">
                <div class="user-details">
                    <h3 class="user-name">{{ userName() }}</h3>
                    <h4 class="user-dept">{{ userDept() }}</h4>
                </div>

                <div class="actions">
                    <button class="action-btn settings-btn" (click)="toggleSettings()" [class.active]="isSettingsOpen()"
                        title="Settings">
                        <span class="material-icons">settings</span>
                    </button>

                    <div class="settings-menu" *ngIf="isSettingsOpen()" @slideRight>
                        <!-- Animated Theme Toggle -->
                        <label class="switch" title="Toggle Theme">
                            <input id="input" type="checkbox" [checked]="isDarkMode()" (change)="toggleTheme()" />
                            <div class="slider round">
                                <div class="sun-moon">
                                    <svg id="moon-dot-1" class="moon-dot" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>
                                    <svg id="moon-dot-2" class="moon-dot" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>
                                    <svg id="moon-dot-3" class="moon-dot" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>
                                    <svg id="light-ray-1" class="light-ray" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>
                                    <svg id="light-ray-2" class="light-ray" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>
                                    <svg id="light-ray-3" class="light-ray" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>

                                    <svg id="cloud-1" class="cloud-dark" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>
                                    <svg id="cloud-2" class="cloud-dark" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>
                                    <svg id="cloud-3" class="cloud-dark" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>
                                    <svg id="cloud-4" class="cloud-light" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>
                                    <svg id="cloud-5" class="cloud-light" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>
                                    <svg id="cloud-6" class="cloud-light" viewBox="0 0 100 100">
                                        <circle cx="50" cy="50" r="50"></circle>
                                    </svg>
                                </div>
                                <div class="stars">
                                    <svg id="star-1" class="star" viewBox="0 0 20 20">
                                        <path
                                            d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z">
                                        </path>
                                    </svg>
                                    <svg id="star-2" class="star" viewBox="0 0 20 20">
                                        <path
                                            d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z">
                                        </path>
                                    </svg>
                                    <svg id="star-3" class="star" viewBox="0 0 20 20">
                                        <path
                                            d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z">
                                        </path>
                                    </svg>
                                    <svg id="star-4" class="star" viewBox="0 0 20 20">
                                        <path
                                            d="M 0 10 C 10 10,10 10 ,0 10 C 10 10 , 10 10 , 10 20 C 10 10 , 10 10 , 20 10 C 10 10 , 10 10 , 10 0 C 10 10,10 10 ,0 10 Z">
                                        </path>
                                    </svg>
                                </div>
                            </div>
                        </label>
                        <button class="Btn" (click)="logout()">
                            <div class="sign"><svg viewBox="0 0 512 512">
                                    <path
                                        d="M377.9 105.9L500.7 228.7c7.2 7.2 11.3 17.1 11.3 27.3s-4.1 20.1-11.3 27.3L377.9 406.1c-6.4 6.4-15 9.9-24 9.9c-18.7 0-33.9-15.2-33.9-33.9l0-62.1-128 0c-17.7 0-32-14.3-32-32l0-64c0-17.7 14.3-32 32-32l128 0 0-62.1c0-18.7 15.2-33.9 33.9-33.9c9 0 17.6 3.6 24 9.9zM160 96L96 96c-17.7 0-32 14.3-32 32l0 256c0 17.7 14.3 32 32 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32l-64 0c-53 0-96-43-96-96L0 128C0 75 43 32 96 32l64 0c17.7 0 32 14.3 32 32s-14.3 32-32 32z">
                                    </path>
                                </svg></div>
                            <div class="text">Logout</div>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Compact footer for collapsed state -->
        <div class="compact-footer" *ngIf="!isSidebarOpen()">
            <button class="action-btn logout" (click)="logout()" title="Logout">
                <span class="material-icons">logout</span>
            </button>
        </div>
    </div>
</div>
